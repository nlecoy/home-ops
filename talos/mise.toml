[tasks.apply-node]
description = "Apply Talos config to a node"
extends = "node"
usage = '''
arg "<node>" help="Node to apply the config to"
arg "[args]" var=#true help="Extra arguments for talosctl apply-config"
'''
confirm = { message = "Apply Talos config to {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
config="$(mise run //talos:render-config "$usage_node")"
printf '%s\n' "$config" | talosctl -n "$usage_node" apply-config -f /dev/stdin "${args[@]}"
'''

[tasks.download-image]
description = "Download Talos machine image"
usage = 'arg "<version>" help="Talos version"'
run = '''
schematic="$(mise run //talos:schematic-id)"
curl -fL --remove-on-error --retry 5 --retry-delay 5 --retry-all-errors --progress-bar \
    -o "talos-${usage_version}-${schematic:0:8}.iso" \
    "https://factory.talos.dev/image/${schematic}/${usage_version}/metal-amd64.iso"
mise run //:log info "Downloaded Talos" version "$usage_version" schematic "$schematic"
'''

[tasks.reboot-node]
description = "Reboot a node"
extends = "node"
usage = 'arg "<node>" help="Node to reboot"'
confirm = { message = "Reboot node {{ usage.node }}?", default = "no" }
run = 'talosctl -n "$usage_node" reboot -m powercycle'

[tasks.render-config]
description = "Render Talos config for a node"
extends = "node"
usage = 'arg "<node>" help="Node to render the config for"'
run = '''
CONTROLPLANE="$(mise run //talos:machine-controller "$usage_node")"
SCHEMATIC="$(mise run //talos:schematic-id)"
export CONTROLPLANE SCHEMATIC
machineconfig="$(mise run //:template machineconfig.yaml.j2)"
networking_patch="$(mise run //:template networking.yaml.j2)"
node_patch="$(mise run //:template "nodes/${usage_node}.yaml.j2")"
talosctl machineconfig patch <(printf '%s\n' "$machineconfig") \
    -p @<(printf '%s\n' "$networking_patch") \
    -p @<(printf '%s\n' "$node_patch")
'''

[tasks.reset-node]
description = "Reset a node"
extends = "node"
usage = '''
arg "<node>" help="Node to reset"
arg "[args]" var=#true help="Extra arguments for talosctl reset"
'''
confirm = { message = "Reset node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
talosctl -n "$usage_node" reset --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --system-labels-to-wipe u-local-hostpath --graceful=false "${args[@]}"
'''

[tasks.shutdown-node]
description = "Shutdown a node"
extends = "node"
usage = '''
arg "<node>" help="Node to shut down"
arg "[args]" var=#true help="Extra arguments for talosctl shutdown"
'''
confirm = { message = "Shutdown node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
talosctl -n "$usage_node" shutdown --force "${args[@]}"
'''

[tasks.upgrade-k8s]
description = "Upgrade Kubernetes version on the cluster"
usage = 'arg "<version>" help="Kubernetes version"'
confirm = { message = "Upgrade Kubernetes to {{ usage.version }}?", default = "no" }
run = '''
controller="$(talosctl config info -o yaml | yq -e '.endpoints[0]')"
talosctl -n "$controller" upgrade-k8s --to "$usage_version"
'''

[tasks.upgrade-node]
description = "Upgrade Talos version on a node"
extends = "node"
usage = '''
arg "<node>" help="Node to upgrade"
arg "[args]" var=#true help="Extra arguments for talosctl upgrade"
'''
confirm = { message = "Upgrade node {{ usage.node }}?", default = "no" }
run = '''
eval "args=(${usage_args:-})"
image="$(mise run //talos:machine-image)"
talosctl -n "$usage_node" upgrade -i "$image" -m powercycle --timeout=10m "${args[@]}"
'''

[tasks.schematic-id]
hide = true
run = '''
schematic="$(mise run //:template schematic.yaml.j2)"
printf '%s\n' "$schematic" | curl -fsSX POST --data-binary @- "https://factory.talos.dev/schematics" | jq -er '.id'
'''

[tasks.machine-controller]
hide = true
usage = 'arg "<node>"'
run = '''
mise run //:template "nodes/${usage_node}.yaml.j2" | yq -e 'select(.machine) | (.machine.type == "controlplane") // ""'
'''

[tasks.machine-image]
hide = true
run = '''
SCHEMATIC="$(mise run //talos:schematic-id)"
export SCHEMATIC
mise run //:template machineconfig.yaml.j2 | yq -e 'select(.machine) | .machine.install.image'
'''
