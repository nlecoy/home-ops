---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-backup
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      immich-backup:
        type: cronjob
        cronjob:
          # After the Immich database dump, which runs at 02:00 by default
          schedule: 0 4 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
          timeZone: &timeZone Europe/Paris
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1@sha256:6025a14d5a673bc38de3efdf48711ee93f0130787798b677c85ca95d4eaa0f7a
            command: ["/bin/bash", "-euo", "pipefail", "-c"]
            args:
              - |
                # Pod hostnames change on each run, so pin the identity that owns
                # the snapshots and the repository maintenance.
                repo=(s3 --bucket="$KOPIA_S3_BUCKET" --endpoint="$KOPIA_S3_ENDPOINT"
                  --override-hostname=immich --override-username=backup)
                kopia repository connect "${repo[@]}" || kopia repository create "${repo[@]}"
                # Immich can regenerate thumbnails and transcoded videos.
                kopia policy set /data --clear-ignore \
                  --add-ignore=/encoded-video --add-ignore=/thumbs \
                  --keep-latest=7 --keep-hourly=0 --keep-daily=14 \
                  --keep-weekly=8 --keep-monthly=12 --keep-annual=0
                kopia snapshot create /data
            env:
              TZ: *timeZone
            envFrom:
              - secretRef:
                  name: immich-backup-secret
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      data:
        type: nfs
        server: nas.internal
        path: /var/nfs/shared/photos
        globalMounts:
          - path: /data
            readOnly: true
      config:
        type: emptyDir
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
