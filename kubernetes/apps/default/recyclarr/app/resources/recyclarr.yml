---
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 6fa7364373e8f06206871d9c20a4fb3e # [French MULTi.VO] UHD Bluray + WEB (2160p)
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 6a554241c0a7121dfa220dcb22066d0f # [Optional] French Audio Version
          select:
            - 07a32f77690263bb9fda1842db7e273f # VOSTFR
            - 84f0acbda9c0c9de783894fb66df25aa # FanSUB

    custom_formats:
      # Rank VOSTFR above plain original-audio releases. MULTi keeps priority
      # through the +500 score that french-multi-vo gives Original + French.
      - trash_ids:
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
        assign_scores_to:
          - trash_id: 6fa7364373e8f06206871d9c20a4fb3e
            score: 100

      - trash_ids:
          - 84f0acbda9c0c9de783894fb66df25aa # FanSUB
        assign_scores_to:
          - trash_id: 6fa7364373e8f06206871d9c20a4fb3e
            score: -10000

radarr:
  movies:
    base_url: http://radarr.default.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: 92ead7022d13a7858d54e328e6a2f8f9 # [French MULTi.VO] UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 741d323a2bb14939d1f53659ef0d5e68 # [Optional] French Audio Version
          select:
            - 9172b2f683f6223e3a1846427b417a3d # VOSTFR
            - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB

    custom_formats:
      - trash_ids:
          - 9172b2f683f6223e3a1846427b417a3d # VOSTFR
        assign_scores_to:
          - trash_id: 92ead7022d13a7858d54e328e6a2f8f9
            score: 100

      - trash_ids:
          - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB
        assign_scores_to:
          - trash_id: 92ead7022d13a7858d54e328e6a2f8f9
            score: -10000
