---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    include:
      - template: sonarr-v4-quality-profile-bluray-web-1080p-french-multi-vo
      - template: sonarr-v4-custom-formats-bluray-web-1080p-french-multi-vo

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb

    quality_definition:
      type: series

    custom_formats:
      # Rank VOSTFR above plain original-audio releases. MULTi keeps priority
      # through the +500 score that french-multi-vo gives Original + French.
      - trash_ids:
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: 100

      - trash_ids:
          - 84f0acbda9c0c9de783894fb66df25aa # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-WEB-1080p
            score: -10000

radarr:
  movies:
    base_url: http://radarr.default.svc.cluster.local:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    include:
      - template: radarr-quality-profile-hd-bluray-web-french-multi-vo
      - template: radarr-custom-formats-hd-bluray-web-french-multi-vo

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb

    quality_definition:
      type: movie

    custom_formats:
      # The radarr french-multi-vo include ships neither format, so both are
      # added here rather than overridden.
      - trash_ids:
          - 9172b2f683f6223e3a1846427b417a3d # VOSTFR
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: 100

      - trash_ids:
          - 02e48d30a176c91baf9e15de05e5dc6a # FanSUB
        assign_scores_to:
          - name: FR-MULTi-VO-HD
            score: -10000
